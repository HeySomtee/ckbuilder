<svg xmlns="http://www.w3.org/2000/svg" viewBox="-44 -12 430 110" role="img" aria-label="Streak"><defs><mask id="cuts"><rect width="64" height="64" fill="white"/><rect class="cut cut-one" x="0" y="28.5" width="64" height="3" fill="black"/><rect class="cut cut-two" x="0" y="41.5" width="64" height="3" fill="black"/></mask></defs><style>
.s-letter{animation:solidify .5s cubic-bezier(.2,.7,.2,1) both}.cut{transform-box:fill-box;transform-origin:left center;animation:cut .18s ease-out both}.cut-one{animation-delay:.48s}.cut-two{transform-origin:right center;animation-delay:.88s}.letters{animation:letters .5s ease-out 1s both}.chart-r{stroke-dasharray:100;animation:chart .7s cubic-bezier(.2,.7,.2,1) 1.1s both}.r-cell,.cell-links{animation:link-in .3s ease-out both}.r-cell-one{animation-delay:1.55s}.r-cell-two{animation-delay:1.7s}.r-cell-three{animation-delay:1.85s}.cell-links{animation-delay:1.9s}.cell-dot{transform-box:fill-box;transform-origin:center;animation:cell .45s cubic-bezier(.2,.7,.2,1) 2s both}.strike{stroke-dasharray:100;fill:none;stroke-linecap:round;opacity:0;animation:strike .5s ease-in-out both}.strike.one{animation-delay:.3s}.strike.two{animation-delay:.7s}.seed{fill:none;stroke-width:1;opacity:0;animation:seed .65s cubic-bezier(.2,.7,.2,1) both}.seed.b{animation-delay:.08s}.seed.c{animation-delay:.16s}
@keyframes link-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@keyframes solidify{from{opacity:0}to{opacity:1}}@keyframes cut{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes letters{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:translateX(0)}}@keyframes chart{0%{stroke-dashoffset:100;stroke:#ff986f}80%{stroke:#ffb894}100%{stroke-dashoffset:0;stroke:#f1f3ed}}@keyframes cell{from{opacity:0;transform:translateY(-8px) rotate(45deg) scale(.4)}to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}@keyframes strike{0%{opacity:0;stroke-dashoffset:100}20%{opacity:1}65%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:-100}}@keyframes seed{0%{opacity:0;transform:translateX(-22px)}25%{opacity:.8}100%{opacity:0;transform:translateX(23px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.strike,.seed{display:none}.chart-r{stroke-dashoffset:0}}
