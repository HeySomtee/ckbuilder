<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101914" />
    <title>Competitions · Streak design preview</title>
    <link rel="icon" href="/brand/on-form-favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/select-controls.css" />
    <link rel="stylesheet" href="/review.css" />
    <link rel="stylesheet" href="/setup.css" />
    <link rel="stylesheet" href="/evidence.css" />
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to competition</a>
    <aside class="preview-bar" aria-label="Design preview controls">
      <div class="preview-label">
        <span class="preview-dot"></span><strong>Design preview</strong
        ><span>Sample data. No wallet or payments.</span>
      </div>
      <div class="preview-controls">
        <label
          >Competition<select id="kind" data-streak-select aria-label="Competition">
            <option value="predictions">Matchweek Calls</option>
            <option value="five">Five Club Challenge</option>
          </select></label
        >
        <label
          >Preview state<select id="scenario" data-streak-select aria-label="Preview state">
            <option value="open">Open · not registered</option>
            <option value="registered">Registered · no entry</option>
            <option value="live">Live · points updating</option>
            <option value="full">Entry closed / markets full</option>
            <option value="finalizing">Finalizing results</option>
            <option value="finished">Finished · you're a winner</option>
            <option value="finished-player">Finished · participated</option>
            <option value="finished-inactive">Finished · didn't participate</option>
            <option value="paid">Finished · prize paid</option>
          </select></label
        >
        <label
          >View<select id="view" data-streak-select aria-label="View">
            <option value="player">Player</option>
            <option value="admin">Admin</option>
          </select></label
        >
      </div>
    </aside>
    <div id="app"></div>
    <dialog id="detail" aria-labelledby="dialog-title"></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
