<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111715" />
    <title>Streak · Navigation and competition artwork preview</title>
    <link rel="icon" href="/brand/on-form-favicon.svg" />
    <link rel="stylesheet" href="/preview.css" />
    <script src="/preview.js" defer></script>
  </head>
  <body>
    <svg class="svg-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H15v-6H9v6H3Z" /></symbol>
        <symbol id="markets" viewBox="0 0 24 24"><path d="M4 19V9m6 10V4m6 15v-7m5 7H2" /></symbol>
        <symbol id="match" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="m10 9 5 3-5 3Z" />
        </symbol>
        <symbol id="shirt" viewBox="0 0 24 24">
          <path d="m8 3-5 3-2 5 5 2v8h12v-8l5-2-2-5-5-3c0 4-8 4-8 0Z" />
        </symbol>
        <symbol id="shield" viewBox="0 0 24 24">
          <path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Zm-4 9 3 3 5-6" />
        </symbol>
        <symbol id="trophy" viewBox="0 0 24 24">
          <path
            d="M7 3h10v7a5 5 0 0 1-10 0Zm0 2H3v3a5 5 0 0 0 5 5m9-8h4v3a5 5 0 0 1-5 5m-4 2v6m-5 0h10"
          />
        </symbol>
        <symbol id="activity" viewBox="0 0 24 24">
          <path d="M3 5h18v16H3Zm5-3v5m8-5v5M3 10h18M7 14h3m4 0h3m-10 3h3" />
        </symbol>
        <symbol id="people" viewBox="0 0 24 24">
          <circle cx="9" cy="7" r="3" />
          <path d="M3 21v-4a6 6 0 0 1 12 0v4m1-17a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v4" />
        </symbol>
        <symbol id="user" viewBox="0 0 24 24">
          <circle cx="12" cy="7" r="4" />
          <path d="M4 22v-3a8 8 0 0 1 16 0v3" />
        </symbol>
        <symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
        <symbol id="right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></symbol>
        <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6" /></symbol>
        <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
        <symbol id="more" viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1" />
          <circle cx="12" cy="12" r="1" />
          <circle cx="19" cy="12" r="1" />
        </symbol>
        <symbol id="wallet" viewBox="0 0 24 24">
          <path d="M20 7H4V3h14v4M4 7v14h17V7ZM17 12h4v5h-4Z" />
        </symbol>
        <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
        <symbol id="image" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <circle cx="8" cy="8" r="1.5" />
          <path d="m3 18 6-6 4 4 3-4 5 6" />
        </symbol>
        <symbol id="upload" viewBox="0 0 24 24">
          <path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5" />
        </symbol>
        <symbol id="clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 6v6l4 2" />
        </symbol>
      </defs>
    </svg>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="review-bar">
      <span class="review-label"
        ><span class="review-dot"></span> DESIGN PREVIEW
        <span class="review-synthetic">· Synthetic examples</span></span
      >
      <div class="scenario-picker">
        <button
          id="scenario-button"
          class="scenario-button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="scenario-menu"
        >
          <span id="scenario-label">Predictions · Open</span><svg><use href="#chevron" /></svg>
        </button>
        <div
          id="scenario-menu"
          class="scenario-menu"
          role="listbox"
          aria-label="Preview scenario"
          hidden
        >
          <button role="option" data-scenario="predictions" aria-selected="true">
            Predictions · Open
          </button>
          <button role="option" data-scenario="five" aria-selected="false">Five · Open</button>
          <button role="option" data-scenario="finished" aria-selected="false">
            Competition finished
          </button>
          <button role="option" data-scenario="no-artwork" aria-selected="false">
            Without artwork
          </button>
          <button role="option" data-scenario="admin" aria-selected="false">
            Admin · Add artwork
          </button>
        </div>
      </div>
    </div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Desktop navigation">
        <a class="brand" href="/?scenario=predictions" aria-label="Streak home"
          ><img src="/brand/on-form-wordmark.svg" alt="Streak"
        /></a>
        <button class="nav-link overview-link" data-preview-route="Overview">
          <svg><use href="#home" /></svg><span>Overview</span>
        </button>
        <div class="nav-section">
          <p class="nav-heading">PLAY</p>
          <button class="nav-link" data-preview-route="Markets">
            <svg><use href="#markets" /></svg><span>Markets</span>
          </button>
          <button class="nav-link" data-preview-route="Matchday">
            <svg><use href="#match" /></svg><span>Matchday</span>
          </button>
          <button class="nav-link" data-preview-route="Streak Five">
            <svg><use href="#shirt" /></svg><span>Streak Five</span><span class="beta">Beta</span>
          </button>
          <button class="nav-link" data-preview-route="Streak Survivor">
            <svg><use href="#shield" /></svg><span>Survivor</span><span class="beta">Beta</span>
          </button>
        </div>
        <section class="competition-nav" aria-label="Competitions">
          <div class="competition-nav-heading">
            <svg><use href="#trophy" /></svg><span>Competitions</span><span class="count">2</span>
          </div>
          <button class="campaign-nav-link is-current" data-go-scenario="predictions">
            <span class="nav-art predictions-art"
              ><img src="/assets/predictions-icon.png" alt="" /></span
            ><span class="campaign-nav-copy"
              ><strong>The Weekend Call</strong
              ><small><i class="status-dot"></i> Predictions · Open</small></span
            ><svg class="route-arrow"><use href="#right" /></svg>
          </button>
          <button class="campaign-nav-link" data-go-scenario="five">
            <span class="nav-art five-art"><img src="/assets/five-icon.png" alt="" /></span
            ><span class="campaign-nav-copy"
              ><strong>Five on Form</strong
              ><small><i class="status-dot"></i> Fantasy · Open</small></span
            ><svg class="route-arrow"><use href="#right" /></svg>
          </button>
          <button class="browse-link" data-preview-route="All competitions">
            Browse competitions<svg><use href="#arrow" /></svg>
          </button>
        </section>
        <div class="nav-personal">
          <p class="nav-heading">YOUR SPACE</p>
          <button class="nav-link" data-preview-route="My activity">
            <svg><use href="#activity" /></svg><span>My activity</span>
          </button>
          <button class="nav-link" data-preview-route="Clubhouse">
            <svg><use href="#people" /></svg><span>Clubhouse</span>
          </button>
          <button class="profile-link" data-preview-route="My Account">
            <span class="avatar">S</span
            ><span><strong>My Account</strong><small>ckt1…6p2x</small></span
            ><svg><use href="#right" /></svg>
          </button>
        </div>
      </aside>
      <div class="app-body">
        <header class="app-header">
          <img class="mobile-brand" src="/brand/on-form-wordmark.svg" alt="Streak" />
          <div class="breadcrumb">
            Your touchline<svg><use href="#right" /></svg><strong>Competitions</strong>
          </div>
          <div class="wallet-block">
            <span class="network-pill"><i></i> CKB testnet</span
            ><button class="wallet-button" data-preview-route="My Account">
              <svg><use href="#wallet" /></svg><span>12,400.00 <small>tCKB</small></span
              ><span class="wallet-address">ckt1…6p2x</span>
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
        <p class="preview-footnote">
          Design preview. Names, matches, prizes and scores are illustrative.
        </p>
      </div>
    </div>
    <nav class="mobile-dock" aria-label="Mobile navigation">
      <button data-preview-route="Overview">
        <svg><use href="#home" /></svg><span>Home</span>
      </button>
      <button data-preview-route="Markets">
        <svg><use href="#markets" /></svg><span>Markets</span>
      </button>
      <button class="active" id="mobile-compete" aria-current="page">
        <svg><use href="#trophy" /></svg><span>Compete</span>
      </button>
      <button data-preview-route="My activity">
        <svg><use href="#activity" /></svg><span>Activity</span>
      </button>
      <button id="more-button" aria-haspopup="dialog">
        <svg><use href="#more" /></svg><span>More</span>
      </button>
    </nav>
    <dialog id="more-dialog" class="more-dialog" aria-labelledby="more-title">
      <div class="sheet-handle"></div>
      <header class="sheet-header">
        <div>
          <p class="eyebrow">YOUR TOUCHLINE</p>
          <h2 id="more-title">Explore Streak</h2>
        </div>
        <button class="icon-button" id="close-more" aria-label="Close navigation">
          <svg><use href="#close" /></svg>
        </button>
      </header>
      <div class="sheet-section">
        <p class="nav-heading">PLAY</p>
        <div class="sheet-game-grid">
          <button data-preview-route="Matchday">
            <svg><use href="#match" /></svg><span>Matchday</span><small>Your match centre</small>
          </button>
          <button data-preview-route="Streak Five">
            <svg><use href="#shirt" /></svg><span>Streak Five <b class="beta">Beta</b></span
            ><small>Pick your five</small>
          </button>
          <button data-preview-route="Streak Survivor">
            <svg><use href="#shield" /></svg><span>Survivor <b class="beta">Beta</b></span
            ><small>Last one standing</small>
          </button>
          <button data-preview-route="Clubhouse">
            <svg><use href="#people" /></svg><span>Clubhouse</span><small>Find your people</small>
          </button>
        </div>
      </div>
      <div class="sheet-section">
        <div class="sheet-section-heading">
          <p class="nav-heading">COMPETITIONS</p>
          <span class="muted">2 open</span>
        </div>
        <button class="sheet-campaign" data-go-scenario="predictions">
          <span class="sheet-art"><img src="/assets/predictions-icon.png" alt="" /></span
          ><span class="sheet-campaign-copy"
            ><strong>The Weekend Call</strong><small>Predictions · Open for entries</small></span
          ><svg><use href="#right" /></svg>
        </button>
        <button class="sheet-campaign" data-go-scenario="five">
          <span class="sheet-art"><img src="/assets/five-icon.png" alt="" /></span
          ><span class="sheet-campaign-copy"
            ><strong>Five on Form</strong><small>Fantasy · Open for entries</small></span
          ><svg><use href="#right" /></svg>
        </button>
      </div>
      <button class="sheet-account" data-preview-route="My Account">
        <span class="avatar">S</span
        ><span><strong>My Account</strong><small>Wallet, profile and settings</small></span
        ><svg><use href="#right" /></svg>
      </button>
    </dialog>
    <div id="toast" class="toast" role="status" hidden>
      <svg><use href="#check" /></svg><span id="toast-text"></span
      ><button id="close-toast" aria-label="Dismiss notification">
        <svg><use href="#close" /></svg>
      </button>
    </div>
  </body>
</html>
