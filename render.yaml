services:
  - type: web
    name: streak-terminal
    env: node
    region: oregon
    plan: starter
    disk:
      name: streak-operator-state
      mountPath: /var/data/streak
      sizeGB: 1
    # Root `npm install` also installs the streak product's deps (via postinstall).
    buildCommand: npm ci --include=dev && npm --prefix products/streak run build
    startCommand: node products/streak/scripts/direct-host.cjs
    envVars:
      # Render sets PORT at runtime; Streak reads process.env.PORT.
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: STREAK_SKIP_ENV_FILE
        value: 1
      - key: STREAK_DIRECT_REGISTRY_DIR
        value: /var/data/streak/registry-current
      - key: STREAK_DIRECT_BATCH_REGISTRY_DIR
        value: /var/data/streak/registry-v4
      - key: STREAK_DIRECT_OPERATOR_DIR
        value: /var/data/streak/operator-private
      # Set only after verifying the disk and the operator handover.
      - key: STREAK_DIRECT_DURABLE_STATE_ACK
        sync: false
      - key: STREAK_SPONSOR_URL
        value: http://127.0.0.1:4101
      - key: STREAK_SPONSOR_IPC_SECRET
        sync: false
      # The supervisor passes this only to sponsor/worker children.
      - key: STREAK_DIRECT_PRIVATE_KEY
        sync: false
      # Exact public HTTPS origin, without a trailing slash. Required for auth.
      - key: STREAK_PUBLIC_ORIGIN
        sync: false
      # Real multi-league API-SPORTS football feed.
      - key: MATCH_PROVIDER
        value: football
      - key: FOOTBALL_LEAGUE_IDS
        value: 39,140,78,135,61,2
      - key: FOOTBALL_INSIGHT_PREFETCH_MINUTES
        value: 90
      - key: FOOTBALL_INSIGHT_PREFETCH_BATCH
        value: 4
      - key: API_SPORTS_KEY
        sync: false
      - key: NOTIFY_PROVIDER
        value: telegram
      # Shared snapshot freshness. The old 1500ms default made the 20s settle
      # loop refetch almost every tick; with a relational store that is waste.
      - key: STORE_READ_TTL_MS
        value: 5000
      # Secrets — set these values in the Render dashboard, never commit them.
      # Neon is the application database; the disk stores operator recovery state.
      # DATABASE_URL is required for data to survive a restart. Use the POOLED
      # connection string (its host contains "-pooler"), and keep the database
      # in the same region as this service — `region: oregon` here pairs with
      # a us-west-2 database. See products/streak/README.md.
      - key: DATABASE_URL
        sync: false
      - key: TREASURY_PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Public URL of this service (Telegram webhook). Set after the first deploy.
      - key: APP_PUBLIC_URL
        sync: false
